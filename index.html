<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cassa Comune De Maggi – Uffreducci</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<style>
  :root {
    --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b;
    --border: #e2e8f0; --demaggi: #6366f1; --uffre: #ec4899;
    --ok: #10b981; --warn: #f59e0b; --radius: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,.06);
    --input-bg: #fff;
    color-scheme: light dark; /* Per i controlli nativi */
  }
  /* Dark Mode Variables */
  html.dark {
    --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
    --border: #334155; --demaggi: #818cf8; --uffre: #f472b6;
    --ok: #34d399; --warn: #fbbf24; --shadow: 0 4px 24px rgba(0,0,0,.3);
    --input-bg: #0f172a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    padding: 16px; line-height: 1.5; transition: background .3s, color .3s;
  }
  .app { max-width: 960px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: .85rem; display: block; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border: none; border-radius: 10px; padding: 8px 14px; font-size: .85rem;
    font-weight: 600; cursor: pointer; transition: transform .1s, opacity .2s;
    display: inline-flex; align-items: center; gap: 6px; background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--demaggi); color: #fff; border: none; }
  .btn-ok { background: var(--ok); color: #fff; border: none; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Dark Mode Toggle */
  #themeToggle { background: none; border: none; font-size: 1.4rem; cursor: pointer; padding: 4px; line-height: 1; }

  .sync-status { font-size: .75rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.online { background: var(--ok); } .dot.offline { background: #ef4444; }
  .dot.syncing { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  .summary { background: var(--card); border-radius: var(--radius); padding: 20px;
    margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 12px; border: 1px solid var(--border); }
  .stat .label { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .stat .value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
  .stat.demaggi .value { color: var(--demaggi); } .stat.uffre .value { color: var(--uffre); }
  .stat .sub { font-size: .7rem; color: var(--muted); font-weight: 400; margin-top: 2px; }

  .status { text-align: center; font-size: 1.1rem; font-weight: 700; padding: 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); }
  .status.pari { color: var(--ok); } .status.deve { color: var(--warn); }

  /* Filtri */
  .filters-card { background: var(--card); border-radius: var(--radius); padding: 16px;
    margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .filters-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .filters-grid input, .filters-grid select {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: .9rem; font-family: inherit; background: var(--input-bg); color: var(--text);
  }
  @media (max-width: 600px) { .filters-grid { grid-template-columns: 1fr; } }

  .form-card, .settings-card { background: var(--card); border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .form-card h2, .settings-card h2 { font-size: .95rem; margin-bottom: 14px; color: var(--muted); font-weight: 600; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 12px; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .field input, .field select { padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 10px; font-size: .95rem; font-family: inherit; background: var(--input-bg); color: var(--text); }
  .field.wide { grid-column: span 2; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .split-toggle { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .split-toggle button { flex: 1; min-width: 120px; padding: 10px; border: 2px solid var(--border);
    background: var(--input-bg); border-radius: 10px; font-size: .78rem; font-weight: 600;
    cursor: pointer; color: var(--muted); transition: all .15s; }
  .split-toggle button.active { border-color: var(--demaggi); background: #eef2ff; color: var(--demaggi); }
  html.dark .split-toggle button.active { background: #312e81; color: #c7d2fe; }
  .split-toggle button[data-mode="meta"].active { border-color: var(--ok); background: #ecfdf5; color: var(--ok); }
  html.dark .split-toggle button[data-mode="meta"].active { background: #064e3b; color: #6ee7b7; }
  .hint { font-size: .72rem; color: var(--muted); margin-bottom: 12px; line-height: 1.4; }

  .month-group { margin-bottom: 24px; }
  .month-header { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; padding-left: 4px; display: flex; justify-content: space-between; }
  .expense { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
    box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px;
    border-left: 4px solid transparent; border: 1px solid var(--border); transition: opacity .2s; }
  .expense.demaggi { border-left-color: var(--demaggi); } .expense.uffre { border-left-color: var(--uffre); }
  .expense .date { font-size: .75rem; color: var(--muted); min-width: 64px; }
  .expense .product { flex: 1; font-weight: 600; font-size: .9rem; }
  .expense .product .tag { display: inline-block; font-size: .65rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  .tag.meta { background: #ecfdf5; color: #047857; } .tag.demaggi { background: #eef2ff; color: #4338ca; } .tag.uffre { background: #fce7f3; color: #be185d; }
  html.dark .tag.meta { background: #064e3b; color: #6ee7b7; } html.dark .tag.demaggi { background: #312e81; color: #c7d2fe; } html.dark .tag.uffre { background: #831843; color: #fbcfe8; }
  .expense .amount { font-weight: 700; font-size: .95rem; min-width: 80px; text-align: right; }
  .expense .amount small { display: block; font-weight: 400; font-size: .68rem; color: var(--muted); }
  .expense .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .2s; }
  .expense:hover .actions { opacity: 1; }
  .expense .actions button { border: none; background: transparent; cursor: pointer; font-size: .95rem; padding: 4px; border-radius: 6px; color: var(--muted); }
  .expense .actions button:hover { background: var(--border); color: var(--text); }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: .9rem; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 12px; font-size: .85rem; font-weight: 500; opacity: 0; transition: all .3s; z-index: 100; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .settings-card { background: #fffbeb; border-color: #fde68a; }
  html.dark .settings-card { background: #451a03; border-color: #78350f; }
  @media (max-width: 600px) { .expense .date { display: none; } .expense .actions { opacity: 1; } .field.wide { grid-column: span 1; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>💶 Cassa Comune <span>De Maggi – Uffreducci</span></h1>
    <div class="toolbar">
      <button id="themeToggle" title="Cambia tema">🌙</button>
      <div class="sync-status"><span class="dot" id="syncDot"></span><span id="syncLabel">Connessione…</span></div>
      <button class="btn" id="settingsBtn">⚙️</button>
    </div>
  </header>

  <!-- FILTRI -->
  <div class="filters-card">
    <div class="filters-grid">
      <input type="text" id="searchFilter" placeholder="🔍 Cerca prodotto...">
      <select id="payerFilter">
        <option value="">Tutti (chi paga)</option>
        <option value="De Maggi">De Maggi</option>
        <option value="Uffreducci">Uffreducci</option>
      </select>
      <select id="modeFilter">
        <option value="">Tutte (modalità)</option>
        <option value="meta">Divisa a metà</option>
        <option value="demaggi">Tutta a De Maggi</option>
        <option value="uffre">Tutta a Uffreducci</option>
      </select>
    </div>
  </div>

  <div class="summary">
    <div class="summary-grid">
      <div class="stat demaggi"><div class="label">De Maggi ha anticipato</div><div class="value" id="totDeMaggi">€ 0,00</div><div class="sub" id="quotaDM">quota: € 0,00</div></div>
      <div class="stat uffre"><div class="label">Uffreducci ha anticipato</div><div class="value" id="totUffre">€ 0,00</div><div class="sub" id="quotaUF">quota: € 0,00</div></div>
      <div class="stat"><div class="label">Totale cassa</div><div class="value" id="totCassa">€ 0,00</div></div>
    </div>
    <div class="status pari" id="status">Conti in pari</div>
  </div>

  <div class="form-card">
    <h2>➕ Aggiungi spesa</h2>
    <form id="expenseForm">
      <div class="form-grid">
        <div class="field"><label>Data</label><input type="date" id="fDate" required></div>
        <div class="field"><label>Chi paga</label><select id="fPayer" required><option value="De Maggi">De Maggi</option><option value="Uffreducci">Uffreducci</option></select></div>
        <div class="field wide"><label>Prodotto</label><input type="text" id="fProduct" placeholder="es. Arance..." required></div>
        <div class="field"><label>Importo reale (€)</label><input type="number" id="fAmount" step="0.01" min="0.01" required></div>
      </div>
      <div class="field" style="margin-bottom:6px;">
        <label style="margin-bottom:6px;display:block;">Come va addebitata?</label>
        <div class="split-toggle" id="splitToggle">
          <button type="button" data-mode="meta" class="active">⚖️ Divisa a metà</button>
          <button type="button" data-mode="demaggi">👤 Tutta a De Maggi</button>
          <button type="button" data-mode="uffre">👤 Tutta a Uffreducci</button>
        </div>
      </div>
      <div class="form-actions"><button type="reset" class="btn">Annulla</button><button type="submit" class="btn btn-primary" id="submitBtn">Aggiungi</button></div>
    </form>
  </div>

  <div class="settings-card" id="settingsPanel" style="display:none;">
    <h2>⚙️ Sincronizzazione</h2>
    <div class="field"><label>Bin ID</label><input type="text" id="cfgBinId"></div>
    <div class="field"><label>API Key</label><input type="password" id="cfgApiKey"></div>
    <div class="form-actions"><button class="btn" id="testSyncBtn">🔌 Test</button><button class="btn btn-ok" id="saveSyncBtn">💾 Salva</button></div>
  </div>

  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  // ============================================================
  // 🔧 CONFIGURAZIONE HARDCODED
  // ============================================================
  const HARDCODED_CONFIG = {
    binId: '6afac94b99f2e6510825ce92',
    apiKey: '$2a$10$kITFuB4O12eIZb7SnbzDOu8ljIw1oDV5u.BGIOCxgwoaz0mv0iJIK'
  };
  // ============================================================

  const STORAGE_KEY = 'cassa_comune_v3';
  const CONFIG_KEY = 'cassa_comune_cfg_v3';
  const THEME_KEY = 'cassa_theme';
  const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';

  let expenses = [];
  let filteredExpenses = [];
  let config = { binId: '', apiKey: '' };
  let isSyncing = false;

  const fmt = (n) => '€ ' + Number(n).toFixed(2).replace('.', ',');
  const monthKey = (d) => d ? d.slice(0, 7) : 'senza-data';
  const monthLabel = (k) => { if (k === 'senza-data') return 'Senza data'; const [y, m] = k.split('-'); const mesi = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic']; return mesi[parseInt(m,10)-1] + ' ' + y; };
  const formatDate = (d) => { if (!d) return '—'; const [y, m, day] = d.split('-'); return `${day}/${m}/${y.slice(2)}`; };
  const todayISO = () => { const d = new Date(); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2200); }
  function setSyncStatus(state, label) { document.getElementById('syncDot').className = 'dot ' + state; document.getElementById('syncLabel').textContent = label; }

  // --- Dark Mode ---
  function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      document.getElementById('themeToggle').textContent = '☀️';
    }
  }
  document.getElementById('themeToggle').onclick = () => {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
  };

  // --- Seed Storico ---
  function seedHistory() {
    const S = [
      ['2025-01-01','Uffreducci','Residuo precedente cassa',38,'meta'],['2025-10-26','Uffreducci','Arance',50,'meta'],['2025-11-14','De Maggi','Vino',136,'meta'],['2025-11-16','Uffreducci','Arance+Avocado',57.9,'meta'],['2025-11-16','Uffreducci','Clementine (solo per De Maggi)',29,'demaggi'],['2025-12-14','Uffreducci','Clementine (solo per De Maggi)',31,'demaggi'],['2025-12-14','Uffreducci','Arance',46,'meta'],['2026-01-11','Uffreducci','Clementine (solo per De Maggi)',31,'demaggi'],['2026-01-11','Uffreducci','Arance+Avocado',57.9,'meta'],['2026-01-11','De Maggi','Residuo spese capodanno',80,'meta'],['2026-02-26','Uffreducci','Arance',58,'meta'],['2026-04-26','Uffreducci','Cinema Adriano',42,'meta'],['2026-05-14','De Maggi','Champagne',540,'meta'],['2026-05-22','Uffreducci',"Cena L'Elementare",117.5,'meta'],['2026-07-12','De Maggi','Vino',120,'meta'],['2026-10-23','Uffreducci','Cena Dogma',352,'meta'],['2026-11-06','Uffreducci','Arance',57,'meta'],['2026-11-15','Uffreducci','Biglietti domus romana',40,'meta'],['2026-11-15','De Maggi','Pranzo De Santis',150,'meta']
    ];
    return S.map(([date, payer, product, amount, splitMode], i) => ({ id: 'seed-' + i, date, payer, product, amount: Number(amount), splitMode, updatedAt: Date.now() + i }));
  }

  // --- Persistenza ---
  function saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses)); }
  function saveConfig() { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }

  function loadLocal() {
    try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) expenses = JSON.parse(raw); } catch (e) { expenses = []; }
    if (!Array.isArray(expenses)) expenses = [];
    expenses = expenses.filter(e => e && typeof e === 'object' && e.id && e.date && e.product && typeof e.amount === 'number');
    if (expenses.length === 0) { expenses = seedHistory(); saveLocal(); }

    let storedConfig = null; try { const c = localStorage.getItem(CONFIG_KEY); if (c) storedConfig = JSON.parse(c); } catch (e) {}
    if (HARDCODED_CONFIG.binId && HARDCODED_CONFIG.apiKey) { config = { ...HARDCODED_CONFIG }; localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }
    else if (storedConfig && storedConfig.binId && storedConfig.apiKey) { config = storedConfig; }
    else { config = { binId: '', apiKey: '' }; }
  }

  // --- Calcoli ---
  function quotaFor(e) { const amt = Number(e.amount) || 0; const mode = e.splitMode || 'meta'; if (mode === 'demaggi') return { dm: amt, uf: 0 }; if (mode === 'uffre') return { dm: 0, uf: amt }; return { dm: amt / 2, uf: amt / 2 }; }

  function computeTotals(list) {
    let paidDM = 0, paidUF = 0, quotaDM = 0, quotaUF = 0, debitoDMversoUF = 0, debitoUFversoDM = 0;
    for (const e of list) {
      const q = quotaFor(e); const amt = Number(e.amount) || 0;
      if (e.payer === 'De Maggi') { paidDM += amt; debitoUFversoDM += q.uf; } else { paidUF += amt; debitoDMversoUF += q.dm; }
      quotaDM += q.dm; quotaUF += q.uf;
    }
    const netto = debitoUFversoDM - debitoDMversoUF;
    return { paidDM, paidUF, quotaDM, quotaUF, netto, tot: paidDM + paidUF };
  }

  function renderSummary() {
    const t = computeTotals(filteredExpenses); // Usa i dati filtrati
    document.getElementById('totDeMaggi').textContent = fmt(t.paidDM);
    document.getElementById('totUffre').textContent = fmt(t.paidUF);
    document.getElementById('totCassa').textContent = fmt(t.tot);
    document.getElementById('quotaDM').textContent = 'quota: ' + fmt(t.quotaDM);
    document.getElementById('quotaUF').textContent = 'quota: ' + fmt(t.quotaUF);
    const s = document.getElementById('status');
    if (Math.abs(t.netto) < 0.005) { s.textContent = '✅ Conti in pari'; s.className = 'status pari'; }
    else if (t.netto > 0) { s.textContent = `Uffre deve a De Maggi: ${fmt(t.netto)}`; s.className = 'status deve'; }
    else { s.textContent = `De Maggi deve a Uffre: ${fmt(-t.netto)}`; s.className = 'status deve'; }
  }

  // --- Filtri ---
  function applyFilters() {
    const search = document.getElementById('searchFilter').value.toLowerCase();
    const payer = document.getElementById('payerFilter').value;
    const mode = document.getElementById('modeFilter').value;
    filteredExpenses = expenses.filter(e => {
      const matchSearch = e.product.toLowerCase().includes(search);
      const matchPayer = !payer || e.payer === payer;
      const matchMode = !mode || (e.splitMode || 'meta') === mode;
      return matchSearch && matchPayer && matchMode;
    });
    renderList(); renderSummary();
  }
  document.getElementById('searchFilter').addEventListener('input', applyFilters);
  document.getElementById('payerFilter').addEventListener('change', applyFilters);
  document.getElementById('modeFilter').addEventListener('change', applyFilters);

  function renderList() {
    const container = document.getElementById('list');
    if (filteredExpenses.length === 0) { container.innerHTML = '<p class="empty">Nessuna spesa trovata.</p>'; return; }
    const sorted = [...filteredExpenses].sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const groups = {}; for (const e of sorted) { const k = monthKey(e.date); (groups[k] = groups[k] || []).push(e); }
    let html = '';
    for (const k of Object.keys(groups).sort().reverse()) {
      const tot = groups[k].reduce((s,x) => s + Number(x.amount||0), 0);
      html += `<div class="month-group"><div class="month-header"><span>${monthLabel(k)}</span><span>${fmt(tot)}</span></div>`;
      for (const e of groups[k]) {
        const payerCls = e.payer === 'De Maggi' ? 'demaggi' : 'uffre'; const mode = e.splitMode || 'meta';
        const tagCls = mode === 'meta' ? 'meta' : (mode === 'demaggi' ? 'demaggi' : 'uffre');
        const tagTxt = mode === 'meta' ? 'divisa' : (mode === 'demaggi' ? 'tutta a De Maggi' : 'tutta a Uffre');
        html += `<div class="expense ${payerCls}"><div class="date">${formatDate(e.date)}</div><div class="product">${escapeHtml(e.product)}<span class="tag ${tagCls}">${tagTxt}</span></div><div class="amount">${fmt(e.amount)}<small>pagato da ${e.payer}</small></div><div class="actions"><button data-edit="${e.id}">✏️</button><button data-del="${e.id}">🗑️</button></div></div>`;
      }
      html += '</div>';
    }
    container.innerHTML = html;
    container.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => startEdit(b.getAttribute('data-edit')));
    container.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      if (confirm('Eliminare questa spesa?')) {
        expenses = expenses.filter(x => x.id !== b.getAttribute('data-del')); saveLocal(); applyFilters(); scheduleSync(); toast('Spesa eliminata');
      }
    });
  }

  // --- Form e Edit ---
  let editingId = null; let currentMode = 'meta';
  function setMode(mode) { currentMode = mode; document.querySelectorAll('#splitToggle button').forEach(b => b.classList.toggle('active', b.getAttribute('data-mode') === mode)); }
  document.getElementById('splitToggle').addEventListener('click', (ev) => { const btn = ev.target.closest('button[data-mode]'); if (btn) setMode(btn.getAttribute('data-mode')); });
  function resetForm() { document.getElementById('expenseForm').reset(); document.getElementById('fDate').value = todayISO(); editingId = null; setMode('meta'); document.getElementById('submitBtn').textContent = 'Aggiungi'; }
  function startEdit(id) { const e = expenses.find(x => x.id === id); if (!e) return; editingId = id; document.getElementById('fDate').value = e.date || ''; document.getElementById('fPayer').value = e.payer; document.getElementById('fProduct').value = e.product; document.getElementById('fAmount').value = e.amount; setMode(e.splitMode || 'meta'); document.getElementById('submitBtn').textContent = 'Salva modifica'; document.getElementById('fProduct').focus(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  document.getElementById('expenseForm').addEventListener('submit', (ev) => {
    ev.preventDefault(); const date = document.getElementById('fDate').value; const payer = document.getElementById('fPayer').value; const product = document.getElementById('fProduct').value.trim(); const amount = parseFloat(document.getElementById('fAmount').value);
    if (!date || !product || !(amount > 0)) { toast('Compila tutti i campi'); return; }
    if (editingId) { const idx = expenses.findIndex(x => x.id === editingId); if (idx >= 0) expenses[idx] = { ...expenses[idx], date, payer, product, amount, splitMode: currentMode, updatedAt: Date.now() }; toast('Modificata'); }
    else { expenses.push({ id: crypto.randomUUID(), date, payer, product, amount, splitMode: currentMode, updatedAt: Date.now() }); toast('Aggiunta'); }
    saveLocal(); applyFilters(); resetForm(); scheduleSync();
  });
  document.getElementById('expenseForm').addEventListener('reset', () => setTimeout(resetForm, 0));

  // --- Sync ---
  function updateSyncUI() { if (!config.binId || !config.apiKey) { setSyncStatus('', 'Sync off'); } else if (isSyncing) { setSyncStatus('syncing', 'Sincronizzo…'); } else { setSyncStatus('online', 'Sincronizzato'); } }
  async function pullRemote() { if (!config.binId || !config.apiKey) return null; const res = await fetch(`${JSONBIN_BASE}/${config.binId}/latest`, { headers: { 'X-Master-Key': config.apiKey } }); if (!res.ok) throw new Error('HTTP ' + res.status); const json = await res.json(); const data = json.record; if (!Array.isArray(data)) return []; return data.filter(e => e && typeof e === 'object' && e.id && e.date && e.product && typeof e.amount === 'number'); }
  async function pushRemote(list) { if (!config.binId || !config.apiKey) return; const res = await fetch(`${JSONBIN_BASE}/${config.binId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': config.apiKey }, body: JSON.stringify(list) }); if (!res.ok) throw new Error('HTTP ' + res.status); }
  function mergeExpenses(local, remote) { const map = new Map(); for (const e of [...remote, ...local]) { if (!e || !e.id) continue; const prev = map.get(e.id); if (!prev || (e.updatedAt || 0) >= (prev.updatedAt || 0)) map.set(e.id, e); } return Array.from(map.values()); }
  async function doSync(pullOnly) {
    if (!config.binId || !config.apiKey || isSyncing) return; isSyncing = true; updateSyncUI();
    try {
      const remote = await pullRemote(); if (remote === null) { isSyncing = false; updateSyncUI(); return; }
      const merged = mergeExpenses(expenses, remote);
      if (JSON.stringify(merged) !== JSON.stringify(expenses)) { expenses = merged; saveLocal(); applyFilters(); }
      if (!pullOnly && JSON.stringify(merged) !== JSON.stringify(remote)) { await pushRemote(merged); }
      setSyncStatus('online', 'Sincronizzato');
    } catch (err) { console.error('Sync error', err); setSyncStatus('offline', 'Errore sync'); }
    finally { isSyncing = false; updateSyncUI(); }
  }
  function scheduleSync() { if (!config.binId || !config.apiKey) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => doSync(false), 800); }
  let syncTimer = null;
  setInterval(() => { if (config.binId && config.apiKey) doSync(true); }, 15000);

  // --- Settings ---
  document.getElementById('settingsBtn').onclick = () => { const p = document.getElementById('settingsPanel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; document.getElementById('cfgBinId').value = config.binId || ''; document.getElementById('cfgApiKey').value = config.apiKey || ''; };
  document.getElementById('saveSyncBtn').onclick = async () => { config.binId = document.getElementById('cfgBinId').value.trim(); config.apiKey = document.getElementById('cfgApiKey').value.trim(); if (!config.binId || !config.apiKey) { toast('Inserisci i valori'); return; } saveConfig(); toast('Configurazione salvata'); await doSync(false); document.getElementById('settingsPanel').style.display = 'none'; };

  // --- Init ---
  initTheme();
  loadLocal();
  document.getElementById('fDate').value = todayISO();
  setMode('meta');
  applyFilters(); // Inizializza la lista e il riepilogo
  updateSyncUI();
  if (config.binId && config.apiKey) setTimeout(() => doSync(false), 500);

  // --- PWA: Registrazione Service Worker (opzionale ma consigliato) ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
    });
  }

})();
</script>
</body>
